<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 480" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45" />
    </filter>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e1e2e" />
      <stop offset="100%" stop-color="#282a36" />
    </linearGradient>
  </defs>

  <!-- Terminal Window Background -->
  <rect x="20" y="20" width="810" height="440" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1.5" filter="url(#shadow)" />

  <!-- Window Titlebar -->
  <path d="M 20 32 A 12 12 0 0 1 32 20 L 818 20 A 12 12 0 0 1 830 32 L 830 60 L 20 60 Z" fill="url(#headerGrad)" />
  <circle cx="44" cy="40" r="6" fill="#ff5f56" stroke="#e0443e" stroke-width="0.5" />
  <circle cx="64" cy="40" r="6" fill="#ffbd2e" stroke="#dea123" stroke-width="0.5" />
  <circle cx="84" cy="40" r="6" fill="#27c93f" stroke="#1aab29" stroke-width="0.5" />
  <text x="425" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, monospace" font-size="12" fill="#8b949e" text-anchor="middle" font-weight="500">terminal — vibe-arch-guard — zsh</text>

  <!-- Terminal Content -->
  <g font-family="'JetBrains Mono', 'Fira Code', 'Courier New', monospace" font-size="13" fill="#c9d1d9">
    <!-- Prompt 1: Drift Case -->
    <text x="45" y="95"><tspan fill="#7ee787">kanau-tech</tspan><tspan fill="#8b949e">@</tspan><tspan fill="#79c0ff">project</tspan> <tspan fill="#d2a8ff">git:(main*)</tspan> <tspan fill="#e6edf3">$</tspan> ./scripts/verify-sync.sh</text>
    
    <text x="45" y="125" fill="#79c0ff">🔍 [Vibe Arch Guard] Inspecting architecture sync for: ARCHITECTURE.md</text>
    <text x="45" y="150" fill="#f0883e">📦 Structural changes detected in:</text>
    <text x="65" y="172" fill="#d2a8ff">• src/api/payments.ts</text>
    <text x="65" y="192" fill="#d2a8ff">• prisma/schema.prisma</text>
    
    <text x="45" y="222" fill="#ff7b72" font-weight="bold">❌ [Vibe Arch Guard] FAIL-CLOSED: Architecture Drift Detected!</text>
    <text x="65" y="242" fill="#8b949e">Structural files were modified without corresponding updates to ARCHITECTURE.md.</text>
    <text x="65" y="262" fill="#79c0ff">👉 Run '/architecture-plan' or update §27 Changelog before committing.</text>
    <text x="45" y="285" fill="#ff7b72">[exit code 1: Commit/Merge Blocked]</text>

    <!-- Divider -->
    <line x1="45" y1="305" x2="805" y2="305" stroke="#30363d" stroke-dasharray="4 4" />

    <!-- Prompt 2: Synced Case -->
    <text x="45" y="335"><tspan fill="#7ee787">kanau-tech</tspan><tspan fill="#8b949e">@</tspan><tspan fill="#79c0ff">project</tspan> <tspan fill="#d2a8ff">git:(main*)</tspan> <tspan fill="#e6edf3">$</tspan> claude -p "/architecture-plan" &amp;&amp; ./scripts/verify-sync.sh</text>
    
    <text x="45" y="365" fill="#79c0ff">🔍 [Vibe Arch Guard] Inspecting architecture sync for: ARCHITECTURE.md</text>
    <text x="45" y="390" fill="#7ee787">📦 Structural changes detected in: src/api/payments.ts, prisma/schema.prisma</text>
    <text x="45" y="415" fill="#56d364" font-weight="bold">✅ [Vibe Arch Guard] Architecture synchronization check passed (ARCHITECTURE.md updated).</text>
    <text x="45" y="438" fill="#56d364">[exit code 0: CI / Pre-commit Verified]</text>
  </g>
</svg>
