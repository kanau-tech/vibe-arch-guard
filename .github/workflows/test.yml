name: Test Suite & Parity Audit

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  run-tests:
    name: Run Master Test Suite & Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set permissions
        run: |
          chmod +x tests/*.sh scripts/*.sh

      - name: Run Master Test Suite
        run: |
          ./tests/run-all-tests.sh
