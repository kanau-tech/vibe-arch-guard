name: Architecture Drift CI Check

on:
  pull_request:
    branches: [ main, master ]
    paths:
      - 'src/**'
      - 'app/**'
      - 'apps/**'
      - 'packages/**'
      - 'internal/**'
      - 'cmd/**'
      - 'prisma/**'
      - 'migrations/**'
      - 'docker-compose*.yml'
      - 'Dockerfile*'
      - '.env.example'
  push:
    branches: [ main, master ]
    paths:
      - 'src/**'
      - 'app/**'
      - 'apps/**'
      - 'packages/**'
      - 'internal/**'
      - 'cmd/**'
      - 'prisma/**'
      - 'migrations/**'
      - 'docker-compose*.yml'
      - 'Dockerfile*'
      - '.env.example'

jobs:
  check-architecture-sync:
    name: Verify Architectural Synchronization (Fail-Closed)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for Bypass Conditions
        id: check_bypass
        run: |
          # 1. Commit message bypass
          COMMIT_MSG=$(git log -1 --pretty=%B)
          if echo "$COMMIT_MSG" | grep -qE '\[skip-arch-drift\]|\[skip-drift\]'; then
            echo "bypass=true" >> $GITHUB_OUTPUT
            echo "ℹ️ Commit message requests drift check skip."
            exit 0
          fi
          
          # 2. PR label bypass (if run on pull_request)
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            LABELS="${{ join(github.event.pull_request.labels.*.name, ',') }}"
            if echo "$LABELS" | grep -q "arch:no-structural-change"; then
              echo "bypass=true" >> $GITHUB_OUTPUT
              echo "ℹ️ PR label 'arch:no-structural-change' detected. Skipping."
              exit 0
            fi
          fi
          
          echo "bypass=false" >> $GITHUB_OUTPUT

      - name: Run Architecture Drift Verifier
        if: steps.check_bypass.outputs.bypass != 'true'
        run: |
          if [ -f "scripts/verify-sync.sh" ]; then
            chmod +x scripts/verify-sync.sh
            ./scripts/verify-sync.sh --ci
          else
            echo "::error title=Missing Verifier::scripts/verify-sync.sh not found."
            exit 1
          fi
