name: Architecture Drift CI Check

on:
  pull_request:
    paths:
      - 'src/**'
      - 'apps/**'
      - 'packages/**'
      - 'prisma/**'
      - 'migrations/**'

jobs:
  check-architecture-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Architecture File Updated
        run: |
          echo "Checking whether PR modified architecture specification..."
          CHANGED_FILES=$(git diff --name-only origin/${{ github.base_ref }} HEAD)
          echo "Changed files in PR:"
          echo "$CHANGED_FILES"
          
          if echo "$CHANGED_FILES" | grep -qE '(ARCHITECTURE\.md|docs/02-ky-thuat/architecture\.md)'; then
            echo "✅ Architecture specification is updated in this PR!"
          else
            echo "::warning title=Architecture Drift Detected::This PR modifies core code without updating ARCHITECTURE.md. Please run '/architecture-plan' or update §27 Changelog."
          fi
